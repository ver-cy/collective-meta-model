name: Update release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release archive
        run: |
          unzip -o collective-meta-model-v0.2.0.zip
          rm collective-meta-model-v0.2.0.zip
      - name: Commit release
        run: |
          git config user.name "ver-cy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: publish Collective Meta-Model 0.2.0"
          git push
