name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run CMM checks
        run: node tools/validate.mjs
      - name: Fetch Vercy standard schemas
        run: git clone --depth 1 https://github.com/ver-cy/meta-universe.git .vercy-standard
      - name: Validate MUIF
        run: >-
          npx --yes ajv-cli validate --strict=false --validate-formats=false --spec=draft2020
          -s .vercy-standard/schemas/manifest.schema.json
          -r .vercy-standard/schemas/common.schema.json
          -r .vercy-standard/schemas/object.schema.json
          -r .vercy-standard/schemas/relationship.schema.json
          -r .vercy-standard/schemas/event.schema.json
          -r .vercy-standard/schemas/contract.schema.json
          -r .vercy-standard/schemas/projection.schema.json
          -d collective.muif.json
      - name: Validate matrix example
        run: >-
          npx --yes ajv-cli validate --strict=false --validate-formats=false --spec=draft2020
          -s schemas/collective-instance.schema.json
          -d examples/matrix-organization.example.json
