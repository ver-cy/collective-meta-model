register_version: 1.0
model: urn:vercy:metamodel:collective
datasets:
  - id: collective-semantic-model
    scope:
      - collective.muif.json
      - bundles/**
      - docs/**
      - schemas/**
    master:
      type: repository
      uri: https://github.com/ver-cy/collective-meta-model
      ref: v0.2.0
    authority: ver-cy
    status: active
    conflict_rule: repository-wins
  - id: vercy-standard
    scope:
      - MUC
      - MMAS
      - MUIF
    master:
      type: external-repository
      uri: https://github.com/ver-cy/meta-universe
      ref: 9cf157bfaa4092c072a1238ecf4cc784a9e53dca
    status: referenced
    conflict_rule: external-master-wins
  - id: world-model-catalogue
    scope:
      - mappings/world-models.yaml
    master:
      type: external-repository
      uri: https://github.com/ver-cy/world-models
      ref: a46d5f8a17b61ca9af7c537cf365b58ba1e610f0
    status: referenced
    conflict_rule: crosswalk-documents-differences
